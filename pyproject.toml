[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robodojo-mirror"
version = "0.1.0"
description = "Policy-independent, on-demand mirror scenes for RoboDojo"
requires-python = ">=3.10"
readme = "README.md"
[project.optional-dependencies]
sim = ["numpy>=1.24", "scipy>=1.10"]
[project.scripts]
robodojo-mirror = "robodojo_mirror.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
